[package]
name = "remagic-upload"
version = "0.2.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/aporicho/remagic-upload"
description = "Foreground-only browser upload and peer synchronization app for ReMagic"

[dependencies]
ab_glyph = "0.2"
blake3 = "1"
bincode = "1"
hex = "0.4"
libc = "0.2"
mdns-sd = "0.13"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
remagic-app-sdk = { path = "../remagic/crates/remagic-app-sdk" }
remagic-core = { path = "../remagic/crates/remagic-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.9"
thiserror = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
