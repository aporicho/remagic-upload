schema = 2
id = "upload"
name = "文件传输"
kind = "user"
description = "浏览器上传，并在 Paper Pro 与 Paper Pro Move 间同步书籍、壁纸和阅读进度"
version = "0.2.1"
package = "remagic-upload"
supported_devices = ["paper_pro", "paper_pro_move"]
supported_os = []
required_remagic_api = 5
uninstall_policy = "keep_data"
exec = "/home/root/apps/upload/current/payload/bin/remagic-upload"
working_dir = "/home/root/apps/upload/current/payload"
display = "qtfb"
resident = true
capabilities = [
  "display:qtfb-v1",
  "input:touch-v1",
  "lifecycle:v2",
  "network:lan-peer-v1",
  "storage:books-write-v1",
  "storage:wallpapers-write-v1",
  "sync:koreader-state-v1",
]
supports_open_path = false

[readiness]
mode = "first_frame"
timeout_ms = 15000

[shutdown]
graceful_timeout_ms = 2500
term_timeout_ms = 3500
kill_timeout_ms = 4500

[runtime]
profile = "qtfb_compat"
required_libraries = []
background_execution = "freeze"

[runtime.directories]
home = "/home/root"
config_home = "/home/root/.config/upload"
data_home = "/home/root/.local/share/upload"
state_home = "/home/root/.local/state/upload"
cache_home = "/home/root/.cache/upload"
runtime_dir = "/run/remagic/apps/upload"

[runtime.locale]
lang = "C.UTF-8"

[runtime.timezone]
name = "Asia/Shanghai"

[runtime.fonts]
directories = ["/home/root/apps/remagic/fonts"]

[runtime.certificates]
required = false

[runtime.network]
mode = "lan_peer"
listen_port = 8788
